<div class="charts-container">
  <div class="charts-header">
    <h3>📊 Historial de Sensores</h3>
    <div class="export-controls">
      <select #rangeSelect class="range-select" aria-label="Rango de historial para descargar">
        <option value="3" selected>Últimos 3 meses (90 días)</option>
        <option value="1">Último mes (30 días)</option>
        <option value="6">Últimos 6 meses (180 días)</option>
        <option value="12">Último año (365 días)</option>
      </select>
      <select #formatSelect class="range-select format-select" aria-label="Formato de exportación">
        <option value="xlsx" selected>📊 Excel (.xlsx)</option>
        <option value="csv">📄 CSV (.csv)</option>
      </select>
      <button class="download-btn" (click)="downloadHistory(rangeSelect.value, formatSelect.value)" [disabled]="downloading">
        <span class="btn-icon">{{ downloading ? '⏳' : '📥' }}</span>
        <span>{{ downloading ? 'Generando...' : 'Descargar' }}</span>
      </button>
    </div>
  </div>
  <div class="charts-grid">
    <div class="chart-card">
      <canvas #tempChart></canvas>
    </div>
    <div class="chart-card">
      <canvas #humChart></canvas>
    </div>
    <div class="chart-card">
      <canvas #soilChart></canvas>
    </div>
  </div>
</div>
