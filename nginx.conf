# ==============================================================================
# CONFIGURACIÓN NGINX: PROTECCIÓN PERIMETRAL Y CONTROL DE ANCHO DE BANDA
# Para AWS Lightsail (Instancia gratuita / recursos limitados)
# ==============================================================================

# 1. ZONAS DE CONTROL DE TASA Y CONEXIONES (Contexto HTTP)
# Limita el número de conexiones simultáneas y tasa de peticiones por IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=stream_limit:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Límite global seguro para el body de peticiones (1 MB)
    client_max_body_size 1M;

    # 2. MITIGACIÓN DE SLOWLORIS Y TIMEOUTS AGRESIVOS
    # Evita que conexiones lentas retengan sockets y consuman memoria/ancho de banda
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 25s;
    send_timeout 15s;

    # 3. COMPRESIÓN GZIP (Ahorro crítico de ancho de banda saliente Egress)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    # Encabezados de seguridad básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 4. PROTECCIÓN DEL STREAM MJPEG (Principal vector de fuga de ancho de banda)
    location /api/camera/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Máximo 2 conexiones simultáneas de stream por IP
        limit_conn addr_limit 2;
        limit_req zone=stream_limit burst=3 nodelay;

        # Evitar buffering para streaming MJPEG
        proxy_buffering off;
        proxy_cache off;

        # Timeout razonable: si el cliente o red se corta, cerrar en 60s (no 24h)
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 5. INGESTA DE FOTO DE CÁMARA DESDE ESP32
    location /api/camera/upload {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Permitir hasta 2 MB y dar margen de transferencia holgado para el ESP32
        client_max_body_size 2M;
        client_body_timeout 25s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        limit_req zone=stream_limit burst=5 nodelay;
    }

    # 6. WEBSOCKET (/ws)
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Limitar conexiones simultáneas de WS por IP
        limit_conn addr_limit 5;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 7. FRONTEND Y REST API GENERAL
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Rate limiting general: 15 req/s con ráfaga de 25
        limit_req zone=general_limit burst=25 nodelay;
        limit_conn addr_limit 15;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
